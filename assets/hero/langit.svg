    <circle cx="760" cy="60" r="1.2" opacity=".6"/><circle cx="860" cy="130" r="1" opacity=".4"/>
    <circle cx="1060" cy="250" r="1" opacity=".35"/><circle cx="470" cy="300" r="1" opacity=".3"/>
