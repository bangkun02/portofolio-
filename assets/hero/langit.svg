<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040916"/>
      <stop offset=".32" stop-color="#13264a"/>
      <stop offset=".58" stop-color="#46668f"/>
      <stop offset=".76" stop-color="#a99ba8"/>
      <stop offset="1" stop-color="#e0c2ae"/>
    </linearGradient>
    <radialGradient id="glow" cx="800" cy="300" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6e0" stop-opacity=".95"/>
      <stop offset=".07" stop-color="#ffeec8" stop-opacity=".6"/>
      <stop offset=".3" stop-color="#cfd9ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#cfd9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="80" cy="60" r="1.6" opacity=".8"/><circle cx="210" cy="140" r="1.2" opacity=".6"/>
    <circle cx="330" cy="40" r="1.8" opacity=".9"/><circle cx="420" cy="200" r="1.1" opacity=".5"/>
    <circle cx="520" cy="90" r="1.4" opacity=".7"/><circle cx="610" cy="30" r="1" opacity=".6"/>
    <circle cx="680" cy="160" r="1.3" opacity=".5"/><circle cx="930" cy="70" r="1.5" opacity=".8"/>
    <circle cx="1010" cy="180" r="1.1" opacity=".5"/><circle cx="1100" cy="40" r="1.7" opacity=".9"/>
    <circle cx="1190" cy="120" r="1.2" opacity=".6"/><circle cx="1290" cy="60" r="1.4" opacity=".7"/>
    <circle cx="1380" cy="190" r="1" opacity=".5"/><circle cx="1460" cy="100" r="1.6" opacity=".8"/>
    <circle cx="1550" cy="30" r="1.2" opacity=".6"/><circle cx="150" cy="250" r="1" opacity=".4"/>
    <circle cx="290" cy="300" r="1.2" opacity=".35"/><circle cx="1250" cy="260" r="1.1" opacity=".4"/>
